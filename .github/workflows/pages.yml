name: Publish legacy URL redirect

on:
  push:
    branches: [main]
    paths:
      - 'legacy-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'koyamarium/the-art-of-numerical-algorithms'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check destination and redirect assets
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          from urllib.request import urlopen
          destination = 'https://koyamarium.github.io/numerical-methods-atlas/'
          with urlopen(destination+'site.json', timeout=30) as response:
              site = json.load(response)
          assert site['publicUrl'] == destination
          for name in ('index.html','404.html','migration.js'):
              assert (Path('legacy-site')/name).is_file()
          for name in ('index.html','404.html'):
              text = (Path('legacy-site')/name).read_text()
              assert destination in text
              assert '/the-art-of-numerical-algorithms/migration.js' in text
          PYTHON
      - uses: actions/upload-pages-artifact@v4
        with:
          path: legacy-site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
